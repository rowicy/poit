version: 2

project_name: poit

builds:
  - main: .
    dir: ./cli/poit
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: poit
    repository:
      owner: rowicy
      name: homebrew-tools
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/rowicy/poit"
    # Empty desc fails `brew style` (Cask/Desc).
    description: "Share Markdown, HTML, and text files"
    # `install_steps` (GoReleaser >= 2.19) emits `postflight_steps`.
    # `{{ .StagedPath }}` becomes Homebrew's `{{staged_path}}` token.
    # No zap block: GoReleaser >= 2.20 emits `zap :not_required`.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/poit"]
          end

# CLI-only release notes. changelog.paths is GoReleaser Pro only, so filter
# on the scope tag .githooks/commit-msg enforces: (cli), [cli], (app,cli), ...
changelog:
  filters:
    include:
      - '[(\[]([^)\]]*[, ])?cli([, ][^)\]]*)?[)\]]'
