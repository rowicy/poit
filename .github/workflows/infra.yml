# This workflow is managed by gh actions-lock.

name: Infra

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/app/**"
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

# Serialize applies; the R2 lockfile would reject a concurrent one anyway.
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  terraform:
    # Fork PRs get no secrets on a public repo, so plan would just fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: pnpm/action-setup@v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5.6.0
        with:
          go-version: "1.24"
          cache-dependency-path: apps/app/wasm/filekind/go.sum
      - run: pnpm install --frozen-lockfile
      # main.tf reads dist/index.js and public/ - both are build outputs.
      - run: pnpm --filter poit-app build
      - run: pnpm --filter poit-app build:frontend

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: terraform init -input=false
        working-directory: infra
      - run: terraform plan -input=false -out=tfplan
        working-directory: infra
      # cloudflare_workers_script.startup_time_ms is a value Cloudflare
      # re-measures on every upload, but the provider plans the prior state's
      # value as known - so an apply whose upload actually landed still fails
      # its post-apply consistency check whenever the measurement shifts by a
      # millisecond ("Provider produced inconsistent result after apply").
      # Upstream closed this NOT_PLANNED, and 5.28.1 still has it:
      # https://github.com/cloudflare/terraform-provider-cloudflare/issues/7326
      #
      # So don't take apply's exit code as the verdict - ask whether the state
      # converged. An empty plan means the upload landed and only the bogus
      # check failed; a real failure leaves its diff pending and exits 2.
      - if: github.event_name != 'pull_request'
        run: terraform apply -input=false tfplan || terraform plan -input=false -detailed-exitcode
        working-directory: infra
