name: Infra

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/app/**"
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

# Serialize applies; the R2 lockfile would reject a concurrent one anyway.
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  terraform:
    # Fork PRs get no secrets on a public repo, so plan would just fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_allowed_emails: ${{ secrets.ALLOWED_EMAILS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache-dependency-path: apps/app/wasm/filekind/go.sum
      - run: pnpm install --frozen-lockfile
      # main.tf reads dist/index.js and public/ - both are build outputs.
      - run: pnpm --filter poit-app build
      - run: pnpm --filter poit-app build:frontend

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: terraform init -input=false
        working-directory: infra
      - run: terraform plan -input=false -out=tfplan
        working-directory: infra
      - if: github.event_name != 'pull_request'
        run: terraform apply -input=false tfplan
        working-directory: infra
