name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "cli/poit/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ci.yml"
  # No paths filter: app/cli are required status checks on main (branch
  # protection), so they must report on every PR or it can never merge.
  pull_request:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # build:frontend needs Go to compile apps/app/wasm/filekind to WASM.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache-dependency-path: apps/app/wasm/filekind/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter poit-app typecheck
      - run: pnpm --filter poit-app typecheck:frontend
      # Confirms the esbuild bundle infra/main.tf's cloudflare_workers_script
      # depends on actually builds; doesn't deploy anything (deploy is
      # `terraform apply`, run locally - see README.md).
      - run: pnpm --filter poit-app build
      - run: pnpm --filter poit-app build:frontend

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache-dependency-path: cli/poit/go.sum
      - run: go build ./...
        working-directory: cli/poit
      - run: go vet ./...
        working-directory: cli/poit
